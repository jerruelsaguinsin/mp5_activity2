<!DOCTYPE html>
<html>
<head>
    <title>Search for a Value</title>
</head>
<body>

<h2>Search for a Value</h2>

<label>How many values?</label><br>
<input type="number" id="count">
<button onclick="createArray()">Enter Values</button>

<br><br>

<p id="arrayDisplay"></p>

<label>Enter value to search:</label><br>
<input type="text" id="searchValue">
<button onclick="searchValue()">Search</button>

<p id="result"></p>

<script>
let arr = [];

function createArray() {
    let count = parseInt(document.getElementById("count").value);

    arr = [];

    for (let i = 0; i < count; i++) {
        arr[i] = prompt("Enter value " + (i + 1) + ":");
    }

    let output = "Array: ";

    for (let i = 0; i < arr.length; i++) {
        output += arr[i];

        if (i < arr.length - 1) {
            output += ", ";
        }
    }

    document.getElementById("arrayDisplay").innerHTML = output;
}

function searchValue() {
    let search = document.getElementById("searchValue").value;
    let found = false;

    for (let i = 0; i < arr.length; i++) {
        if (arr[i] == search) {
            document.getElementById("result").innerHTML =
                "Value \"" + search + "\" found at index " + i + ".";
            found = true;
            break;
        }
    }

    if (found == false) {
        document.getElementById("result").innerHTML =
            "Value \"" + search + "\" does not exist in the array.";
    }
}
</script>

</body>
</html>
