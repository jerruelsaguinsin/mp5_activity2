<!DOCTYPE html>
<html>
<head>
    <title>Search for a Value</title>
</head>
<body>

    <h2>Search for a Value</h2>

    <label>Enter array values (separated by commas and spaces):</label><br>
    <input type="text" id="arrayInput"><br><br>

    <label>Enter value to search:</label><br>
    <input type="text" id="searchValue"><br><br>

    <button onclick="searchArray()">Search</button>

    <p id="result"></p>

    <script>
        function searchArray() {
            let input = document.getElementById("arrayInput").value;
            let search = document.getElementById("searchValue").value;

            let arr = [];
            let word = "";
            let count = 0;

            for (let i = 0; i <= input.length; i++) {
                if (i == input.length || input[i] == ",") {
                    arr[count] = word;
                    count++;
                    word = "";

                    if (input[i + 1] == " ") {
                        i++;
                    }
                } else {
                    word += input[i];
                }
            }

            let found = false;

            for (let i = 0; i < count; i++) {
                if (arr[i] == search) {
                    document.getElementById("result").innerHTML =
                        "Value '" + search + "' found at index " + i;
                    found = true;
                    break;
                }
            }

            if (!found) {
                document.getElementById("result").innerHTML =
                    "Value '" + search + "' does not exist in the array.";
            }
        }
    </script>

</body>
</html>
